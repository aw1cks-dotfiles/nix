name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let trusted main builds finish seeding the cache; superseded PRs can stop.
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  skill-input-gate:
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ github.event_name == 'push' || steps.gate.outputs.approved == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check current skill approval
        id: gate
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/skill_input_review.py gate
  check:
    name: host-check (${{ matrix.system }})
    needs: skill-input-gate
    if: needs.skill-input-gate.outputs.approved == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: samueldr/lix-gha-installer-action@v2026-02-22
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # auto-optimise-store uses /nix/store/.links, which is known to
          # conflict with cache-nix-action restore.
          # Lix enables it by default. Let's explicitly opt out.
          extra_nix_config: |
            auto-optimise-store = false
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Save caches on active refs for faster PR reruns, but purge older
          # same-ref caches so rebases and follow-up commits do not accumulate.
          save: true
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
          gc-max-store-size-linux: 2G
          gc-max-store-size-macos: 2G
      - name: Configure public Cachix substitutions
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: aw1cks-nix
          # PRs and builds never receive publishing credentials. Upload only the
          # explicit CI cache closure in the trusted-main step below.
          skipPush: true
      - name: Evaluate native host derivations
        run: |
          nix eval .#checks.${{ matrix.system }}.host-derivations.drvPath \
            --accept-flake-config \
            --no-update-lock-file \
            --raw
      - name: Run flake checks (${{ matrix.system }})
        run: |
          nix flake check \
            --accept-flake-config \
            --no-update-lock-file \
            --keep-going \
            --system ${{ matrix.system }}
      - name: Publish expensive CI outputs
        if: github.repository == 'aw1cks-dotfiles/nix' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix run .#publish-ci-cache --accept-flake-config --no-update-lock-file -- aw1cks-nix
